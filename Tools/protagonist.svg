      <rect x="30" y="12" width="5" height="2" fill="#192829"/>
      <rect x="31" y="12" width="3" height="1" fill="#80d8bc"/>
      <rect x="42" y="18" width="2" height="2" fill="#e59a50"/>
    </g>
    <!-- North-facing back: pack and raised rifle make the silhouette readable. -->
    <g id="hero-north">
      <path d="M30 27h8v3h4v9h-3v4H24v-3h-3v-9h4v-3h5z" fill="#192829"/>
      <path d="M25 30h13v2h3v6h-3v3H25v-3h-2v-6h2z" fill="#9b5338"/>
      <path d="M27 31h9v2h2v4h-2v2h-9v-2h-2v-4h2z" fill="#536a68"/>
      <!-- large battery pack -->
      <path d="M25 27h13v2h3v11h-3v3H25v-2h-3V30h3z" fill="#192829"/>
      <rect x="26" y="30" width="12" height="9" fill="#253b3b"/>
      <rect x="28" y="31" width="8" height="5" fill="#536a68"/>
      <rect x="29" y="32" width="6" height="2" fill="#80d8bc"/>
      <rect x="30" y="35" width="4" height="2" fill="#9b5338"/>
      <rect x="27" y="39" width="10" height="2" fill="#e59a50"/>
      <rect x="23" y="32" width="2" height="6" fill="#8ba39a"/>
