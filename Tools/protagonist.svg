      <path d="M31 8h4v3h2v13h-2v6h-5v-5h-2V12h3z" fill="#192829"/>
      <rect x="32" y="10" width="2" height="14" fill="#8ba39a"/>
      <rect x="31" y="9" width="4" height="2" fill="#ddd5ac"/>
      <rect x="30" y="23" width="6" height="3" fill="#9b5338"/>
      <rect x="28" y="25" width="10" height="4" fill="#536a68"/>
      <rect x="28" y="26" width="2" height="3" fill="#cec297"/>
