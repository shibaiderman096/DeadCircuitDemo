      <rect x="36" y="7" width="4" height="2" fill="#ddd5ac"/>
      <rect x="40" y="11" width="2" height="2" fill="#e59a50"/>
      <rect x="34" y="20" width="7" height="3" fill="#536a68"/>
      <rect x="35" y="21" width="3" height="3" fill="#cec297"/>
    </g>    <!-- Four registered boot/leg poses; feet stay on the same baseline. -->
    <g id="legs0">
      <path d="M24 40h8v8h-2v4h-8v-3h2zM34 40h7v8h2v4h-8v-3h-2z" fill="#192829"/>
      <rect x="26" y="42" width="4" height="7" fill="#253b3b"/>
      <rect x="35" y="42" width="4" height="7" fill="#536a68"/>
      <rect x="24" y="50" width="8" height="3" fill="#192829"/>
      <rect x="34" y="50" width="9" height="3" fill="#192829"/>
      <rect x="26" y="50" width="4" height="1" fill="#e59a50"/>
      <rect x="36" y="50" width="4" height="1" fill="#80d8bc"/>
    </g>
    <g id="legs1">
      <path d="M22 40h8v8h-2v4h-8v-3h2zM36 40h7v8h2v4h-8v-3h-2z" fill="#192829"/>
      <rect x="24" y="42" width="4" height="7" fill="#253b3b"/>
      <rect x="37" y="42" width="4" height="7" fill="#536a68"/>
      <rect x="22" y="50" width="8" height="3" fill="#192829"/>
      <rect x="36" y="50" width="9" height="3" fill="#192829"/>
      <rect x="24" y="50" width="4" height="1" fill="#e59a50"/>
      <rect x="38" y="50" width="4" height="1" fill="#80d8bc"/>
    </g>
    <g id="legs2">
      <path d="M26 40h8v8h-2v4h-8v-3h2zM32 40h7v8h2v4h-8v-3h-2z" fill="#192829"/>
      <rect x="28" y="42" width="4" height="7" fill="#253b3b"/>
      <rect x="33" y="42" width="4" height="7" fill="#536a68"/>
      <rect x="26" y="50" width="8" height="3" fill="#192829"/>
      <rect x="32" y="50" width="9" height="3" fill="#192829"/>
      <rect x="28" y="50" width="4" height="1" fill="#e59a50"/>
      <rect x="34" y="50" width="4" height="1" fill="#80d8bc"/>
    </g>
    <g id="legs3">
      <path d="M25 40h8v8h-2v4h-8v-3h2zM31 40h7v8h2v4h-8v-3h-2z" fill="#192829"/>
      <rect x="27" y="42" width="4" height="7" fill="#253b3b"/>
      <rect x="32" y="42" width="4" height="7" fill="#536a68"/>
      <rect x="25" y="50" width="8" height="3" fill="#192829"/>
      <rect x="31" y="50" width="9" height="3" fill="#192829"/>
      <rect x="27" y="50" width="4" height="1" fill="#e59a50"/>
      <rect x="33" y="50" width="4" height="1" fill="#80d8bc"/>
    </g>
  </defs>
  <!-- Rows: east, north, west, south. Columns: four registered walk poses. -->
  <g transform="translate(0 0)"><use href="#legs0"/><use href="#hero-side"/></g>
  <g transform="translate(64 0)"><use href="#legs1"/><use href="#hero-side" transform="translate(0 -1)"/></g>
  <g transform="translate(128 0)"><use href="#legs2"/><use href="#hero-side"/></g>
  <g transform="translate(192 0)"><use href="#legs3"/><use href="#hero-side" transform="translate(0 -1)"/></g>

  <g transform="translate(0 64)"><use href="#legs0"/><use href="#hero-north"/><use href="#north-rifle-front"/></g>
  <g transform="translate(64 64)"><use href="#legs1"/><use href="#hero-north" transform="translate(0 -1)"/><use href="#north-rifle-front" transform="translate(0 -1)"/></g>
  <g transform="translate(128 64)"><use href="#legs2"/><use href="#hero-north"/><use href="#north-rifle-front"/></g>
  <g transform="translate(192 64)"><use href="#legs3"/><use href="#hero-north" transform="translate(0 -1)"/><use href="#north-rifle-front" transform="translate(0 -1)"/></g>

  <g transform="translate(64 128) scale(-1 1)"><use href="#legs0"/><use href="#hero-side"/></g>
  <g transform="translate(128 128) scale(-1 1)"><use href="#legs1"/><use href="#hero-side" transform="translate(0 -1)"/></g>
  <g transform="translate(192 128) scale(-1 1)"><use href="#legs2"/><use href="#hero-side"/></g>
  <g transform="translate(256 128) scale(-1 1)"><use href="#legs3"/><use href="#hero-side" transform="translate(0 -1)"/></g>

  <g transform="translate(0 192)"><use href="#legs0"/><use href="#hero-south"/></g>
  <g transform="translate(64 192)"><use href="#legs1"/><use href="#hero-south" transform="translate(0 -1)"/></g>
  <g transform="translate(128 192)"><use href="#legs2"/><use href="#hero-south"/></g>
  <g transform="translate(192 192)"><use href="#legs3"/><use href="#hero-south" transform="translate(0 -1)"/></g>
</svg>


