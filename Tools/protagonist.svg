<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" shape-rendering="crispEdges">
  <defs>
    <!-- E-facing upper body. Flip this for the west-facing row. -->
    <g id="hero-side">
      <!-- field pack and antenna -->
      <path d="M20 26h6v3h-3v12h3v3h-8v-3h-2V30h4z" fill="#192829"/>
      <path d="M19 29h5v12h-5z" fill="#536a68"/>
      <rect x="20" y="31" width="3" height="2" fill="#80d8bc"/>
      <rect x="20" y="35" width="3" height="4" fill="#253b3b"/>
      <rect x="18" y="25" width="2" height="5" fill="#192829"/>
      <rect x="17" y="23" width="4" height="2" fill="#e59a50"/>
      <!-- rifle and hands -->
      <path d="M38 30h15v2h4v3h-3v2h-4v-2h-9v3h-3v-3h-2z" fill="#192829"/>
      <rect x="41" y="31" width="10" height="2" fill="#8ba39a"/>
      <rect x="51" y="31" width="5" height="1" fill="#ddd5ac"/>
      <rect x="44" y="33" width="3" height="3" fill="#9b5338"/>
      <rect x="38" y="29" width="4" height="3" fill="#cec297"/>
      <!-- torso silhouette and coat -->
      <path d="M25 27h13v2h4v3h3v9h-3v4H23v-3h-3v-9h3v-4h2z" fill="#192829"/>
      <path d="M27 29h9v2h4v3h3v5h-3v3H24v-3h-2v-7h3v-2h2z" fill="#9b5338"/>
      <path d="M27 39h13v3H25v-3z" fill="#253b3b"/>
      <!-- shoulder armor, collar and circuit core -->
      <path d="M23 30h5v4h-4v3h-3v-4h2z" fill="#536a68"/>
      <rect x="23" y="30" width="4" height="1" fill="#8ba39a"/>
      <path d="M37 29h5v4h-4v3h-3v-4h2z" fill="#536a68"/>
      <rect x="38" y="30" width="3" height="1" fill="#ddd5ac"/>
      <path d="M29 30h6v2h2v7h-2v2h-6v-2h-2v-7h2z" fill="#253b3b"/>
      <rect x="30" y="32" width="5" height="5" fill="#80d8bc"/>
      <rect x="31" y="33" width="3" height="3" fill="#536a68"/>
      <rect x="32" y="34" width="1" height="1" fill="#ddd5ac"/>
      <rect x="25" y="36" width="2" height="3" fill="#e59a50"/>
      <!-- helmet and side visor -->
      <path d="M27 14h11v2h4v4h2v7h-3v3H26v-3h-3v-9h3v-2h1z" fill="#192829"/>
      <path d="M28 16h9v2h4v4h-2v5h-3v2h-8v-2h-3v-7h3z" fill="#cec297"/>
      <path d="M26 14h12v2h4v3H25v-2h1z" fill="#9b5338"/>
      <rect x="28" y="15" width="9" height="1" fill="#e59a50"/>
      <path d="M35 21h7v4h-2v2h-5z" fill="#253b3b"/>
      <rect x="36" y="22" width="5" height="2" fill="#80d8bc"/>
      <rect x="39" y="22" width="1" height="1" fill="#ddd5ac"/>
      <rect x="24" y="23" width="2" height="4" fill="#536a68"/>
      <rect x="25" y="23" width="1" height="2" fill="#8ba39a"/>
