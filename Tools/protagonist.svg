      <path d="M26 14h13v2h4v4H24v-3h2z" fill="#9b5338"/>
      <rect x="28" y="15" width="9" height="1" fill="#e59a50"/>
      <path d="M26 20h16v5h-2v2H28v-2h-2z" fill="#253b3b"/>
