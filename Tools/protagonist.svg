      <path d="M25 27h14v2h4v4h3v8h-4v4H22v-3h-3v-8h3v-4h3z" fill="#192829"/>
      <path d="M27 29h10v2h4v3h3v5h-3v3H24v-3h-2v-6h3v-2h2z" fill="#9b5338"/>
      <path d="M24 30h5v4h-4v3h-3v-4h2z" fill="#536a68"/>
      <rect x="23" y="30" width="4" height="1" fill="#8ba39a"/>
      <path d="M37 29h5v4h-3v3h-3v-4h1z" fill="#536a68"/>
      <rect x="38" y="30" width="3" height="1" fill="#ddd5ac"/>
      <path d="M29 30h7v2h2v7h-2v2h-7v-2h-2v-7h2z" fill="#253b3b"/>
      <rect x="30" y="32" width="6" height="5" fill="#80d8bc"/>
      <rect x="31" y="33" width="4" height="2" fill="#536a68"/>
      <rect x="32" y="36" width="2" height="1" fill="#ddd5ac"/>
      <rect x="26" y="38" width="2" height="3" fill="#e59a50"/>
