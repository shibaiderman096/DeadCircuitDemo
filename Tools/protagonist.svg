      <path d="M27 14h12v2h3v5h-2v6h-3v3H27v-2h-3v-8h2v-4h1z" fill="#192829"/>
      <path d="M28 17h10v2h2v5h-3v3h-9v-2h-2v-6h2z" fill="#536a68"/>
      <path d="M26 14h13v2h3v3H25v-2h1z" fill="#9b5338"/>
      <rect x="28" y="15" width="9" height="1" fill="#e59a50"/>
      <rect x="30" y="19" width="5" height="2" fill="#253b3b"/>
      <rect x="31" y="20" width="3" height="1" fill="#80d8bc"/>
      <rect x="23" y="23" width="3" height="4" fill="#253b3b"/>
      <rect x="40" y="23" width="3" height="4" fill="#253b3b"/>
      <rect x="30" y="12" width="5" height="2" fill="#192829"/>
      <rect x="31" y="12" width="3" height="1" fill="#80d8bc"/>
