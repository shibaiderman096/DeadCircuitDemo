      <rect x="29" y="22" width="2" height="1" fill="#ddd5ac"/>
      <rect x="36" y="22" width="2" height="1" fill="#536a68"/>
      <rect x="23" y="24" width="2" height="3" fill="#536a68"/>
      <rect x="42" y="24" width="2" height="3" fill="#536a68"/>
      <rect x="30" y="12" width="5" height="2" fill="#192829"/>
      <rect x="31" y="12" width="3" height="1" fill="#80d8bc"/>
      <!-- lowered rifle -->
      <path d="M31 36h5v3h2v12h-2v4h-4v-3h-2V42h-2v-3h3z" fill="#192829"/>
      <rect x="33" y="39" width="2" height="10" fill="#8ba39a"/>
      <rect x="32" y="49" width="4" height="4" fill="#536a68"/>
      <rect x="31" y="40" width="6" height="3" fill="#9b5338"/>
      <rect x="30" y="37" width="7" height="3" fill="#cec297"/>
    </g>
    <g id="north-rifle-front">
      <path d="M35 7h5v2h2v12h-2v4h-4v-3h-2v-11h1z" fill="#192829"/>
